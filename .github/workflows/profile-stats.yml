name: Profile statistics

on:
  push:
    branches: [dev, main]
    paths:
      - README.md
      - assets/**
      - .github/scripts/**
      - .github/workflows/profile-stats.yml
  pull_request:
    branches: [dev, main]
    paths:
      - README.md
      - assets/**
      - .github/scripts/**
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate profile and generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  update:
    name: Refresh public statistics
    needs: validate
    # Never expose secrets to pull requests or write from an arbitrary branch/fork.
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'hajisml/hajisml' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Refresh GitHub cards, WakaTime languages, and Dev Excuses
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 -B .github/scripts/update_profile.py
      - name: Validate generated output before publishing
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Publish only generated profile content to the triggering branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- README.md assets/overview-light.svg assets/overview-dark.svg assets/languages-light.svg assets/languages-dark.svg
          if git diff --cached --quiet; then
            echo "Generated profile content has not changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile statistics'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Report upstream refresh failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'An upstream service could not be refreshed. Its previous output was retained.'
          exit 1
