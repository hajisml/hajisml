name: Profile statistics

on:
  push:
    branches: [dev, main]
    paths:
      - README.md
      - assets/**
      - .github/scripts/**
      - .github/workflows/profile-stats.yml
  pull_request:
    branches: [dev, main]
    paths:
      - README.md
      - assets/**
      - .github/scripts/**
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate profile and generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  generate-streaks:
    name: Generate weekly streak cards
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'hajisml/hajisml' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The renderer has a read-only token and no WakaTime credentials.
      - name: Render light weekly streak
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d # v1.8.1
        with:
          path: assets/streak-light.svg
          options: user=hajisml&mode=weekly&theme=github-light&background=00000000&hide_border=true&disable_animations=true&date_format=j%20M%5B%20Y%5D&ring=0969DA&fire=0969DA&currStreakNum=1F2328&sideLabels=1F2328&currStreakLabel=0969DA&sideNums=1F2328&dates=59636E
      - name: Render dark weekly streak
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d # v1.8.1
        with:
          path: assets/streak-dark.svg
          options: user=hajisml&mode=weekly&theme=github-dark&background=00000000&hide_border=true&disable_animations=true&date_format=j%20M%5B%20Y%5D&ring=79C0FF&fire=79C0FF&currStreakNum=F0F6FC&sideLabels=F0F6FC&currStreakLabel=79C0FF&sideNums=F0F6FC&dates=9198A1
      - name: Validate generated cards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-streak-cards
          path: |
            assets/streak-light.svg
            assets/streak-dark.svg
          if-no-files-found: error
          retention-days: 1

  update:
    name: Refresh public statistics
    needs: [validate, generate-streaks]
    # Never expose secrets to pull requests or write from an arbitrary branch/fork.
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'hajisml/hajisml' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-streak-cards
          path: assets
      - name: Refresh GitHub cards, WakaTime languages, and Dev Excuses
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 -B .github/scripts/update_profile.py
      - name: Validate generated output before publishing
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Publish only generated profile content to the triggering branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- README.md assets/overview-light.svg assets/overview-dark.svg assets/languages-light.svg assets/languages-dark.svg assets/streak-light.svg assets/streak-dark.svg
          if git diff --cached --quiet; then
            echo "Generated profile content has not changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile statistics'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Report upstream refresh failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'An upstream service could not be refreshed. Its previous output was retained.'
          exit 1
